server.port=8084
spring.application.name=voice-insights-api

# ── Actuator / Prometheus ───────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}

# ── OpenAI ────────────────────────────────────────────────────────────────
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.embedding.options.model=text-embedding-3-large
# Must match voice-insights-ingestor's openai.embed.dims and the
# voice_insights.product_chunks vector(3072) column — both read/write the
# same shared column.
spring.ai.openai.embedding.options.dimensions=3072

# Realtime transcription — browser mic audio is relayed to this model over a
# server-side websocket (see voice/OpenAiRealtimeTranscriptionClient).
voice.openai.realtime.url=wss://api.openai.com/v1/realtime?intent=transcription
voice.openai.realtime.transcription-model=gpt-4o-transcribe
# Biases transcription vocabulary toward Singapore/Malaysia/China insurance
# conversations. gpt-4o-transcribe rejects the 'languages'/'keywords' session
# fields outright (confirmed live), so 'prompt' free text is the only accepted
# bias mechanism for this model.
voice.openai.realtime.prompt=This is a conversation between an insurance agent \
  and a customer in Singapore, Malaysia, or China. Expect Singlish or Manglish \
  expressions, code-switching between English, Mandarin, and Malay, Chinese \
  names (e.g. Tan, Lim, Wong, Lee, Chen, Ng), Malay names (e.g. Ahmad, Siti, \
  Rahman, Nurul), and financial/insurance terms such as CPF, Central Provident \
  Fund, MediSave, MediShield, critical illness, term life, premium, dependents, \
  sum assured, rider.

# ── PostgreSQL / pgvector — SAME server as cobol-ingestor-api / cobalt-rag-api,
#    own schema (see db.schema below and every *Store's self-provisioning DDL) ──
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ingestor}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver
voice.db.schema=voice_insights

# ── Redis (own instance — see this project's docker-compose.yml) ───────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.timeout=2000ms
voice.redis.session-cache-ttl-seconds=300

# ── Product retrieval (Need agent) ──────────────────────────────────────────
voice.product-search.top-k=8
voice.product-search.similarity-threshold=0.3
